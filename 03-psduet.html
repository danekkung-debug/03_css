<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<h2>:hover (마우스를 올린 상태)</h2>
<button class="btn"주문하기</button>

<h2>:focus (입력 칸을 사용자가 선택 중인 상태)</h2>
<input placeholder="이름을 입력해 보세요" />

<h2>:first-child, :last-child, :nth-child</h2>
<ul>
    <li>첫번쨰</li>
    <li>두번쨰</li>
    <li>세번쨰</li>
    <li>네번쨰</li>
    <li>다섯번쨰</li>
</ul>
</body>
</html>
