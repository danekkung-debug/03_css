<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDash - Profile Information</title>

    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="main.style.css">
</head>
<body>

<!-- 좌측 사이드바 -->
<aside class="sidebar">
    <div class="logo">
        <!-- 사진과 100% 일치하는 우측 하단 구멍이 뚫린 육각형 로고 아이콘 -->
        <svg class="icon logo-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L19.5 6.3V17.7L12 22L4.5 17.7V6.3L12 2Z"/>
            <!-- 우측 하단 파인 구멍 효과 -->
            <path d="M13.5 13.5L18 11V15.5L13.5 18V13.5Z" fill="#151a2e"/>
        </svg>
        <span>MyDash</span>
    </div>
    <nav class="nav-menu">
        <a href="#" class="nav-item active">
            <!-- Profile Info (스마트폰 프로필 아이콘) -->
            <svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="3" ry="3"/>
                <circle cx="12" cy="10" r="2.5"/>
                <path d="M8 17c0-2 1.8-3 4-3s4 1 4 3"/>
            </svg>
            <span>Profile Info</span>
        </a>
        <a href="#" class="nav-item">
            <!-- Account Security (방패 아이콘) -->
            <svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <span>Account Security</span>
        </a>
        <a href="#" class="nav-item">
            <!-- Notifications (종 아이콘) -->
            <svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span>Notifications</span>
        </a>
        <a href="#" class="nav-item">
            <!-- Billing Details (신용카드 아이콘) -->
            <svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                <line x1="1" y1="10" x2="23" y2="10"/>
            </svg>
            <span>Billing Details</span>
        </a>
    </nav>
</aside>

<!-- 메인 영역 -->
<div class="main-wrapper">
    <!-- 상단 헤더 -->
    <header class="header">
        <div class="header-title">
            <h1>Profile Information</h1>
            <p>Update your photo and personal details.</p>
        </div>
        <div class="header-user">
            <button class="search-btn" aria-label="Search">
                <!-- 돋보기 아이콘 -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>
            <div class="user-avatar-sm">A</div>
        </div>
    </header>

    <!-- 중앙 카드 콘텐츠 -->
    <main class="content-container">
        <div class="card">
            <!-- 아바타 이미지 & 버튼 -->
            <div class="avatar-section">
                <div class="avatar-large">A</div>
                <div class="avatar-actions">
                    <button class="btn btn-primary">
                        <!-- 구름 업로드 아이콘 -->
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 16l-4-4-4 4"/>
                            <path d="M12 12v9"/>
                            <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
                        </svg>
                        Upload
                    </button>
                    <button class="btn btn-outline">
                        <!-- 휴지통 아이콘 -->
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        Remove
                    </button>
                </div>
            </div>

            <hr class="divider">

            <!-- 입력 폼 -->
            <form class="profile-form" onsubmit="event.preventDefault();">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" value="abc@abc.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone">
                </div>

                <!-- 커스텀 체크박스 (평소 라인만 / 마우스 호버 및 체크 시 파란색) -->
                <div class="checkbox-group">
                    <input type="checkbox" id="newsletter">
                    <label for="newsletter">
              <span class="custom-checkbox">
                <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
                        Receive updates and newsletters via email
                    </label>
                </div>

                <hr class="divider">

                <div class="form-actions">
                    <button type="button" class="btn btn-outline">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
