<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Layout Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main-container">
    <div class="dashboard-grid">

        <!-- 왼쪽 대형 카드 -->
        <div class="card left-card">
            <div class="card-header">
                <span class="rating">★ 4.98</span>
                <span class="badge">BEST REVIEWS</span>
            </div>
            <div class="card-content">
                <h1>Flex!</h1>
                <div class="divider"></div>
                <p>Flexbox is awesome and we love it because we can make many things.</p>
            </div>
        </div>

        <!-- 오른쪽 섹션 -->
        <div class="right-section">
            <!-- 상단 행 -->
            <div class="row top-row">
                <div class="card gradient-card"></div>
                <div class="card nav-card">
                    <ul class="nav-links">
                        <li><a href="#">ABOUT</a></li>
                        <li><a href="#">SOLUTIONS</a></li>
                        <li><a href="#">PORTFOLIO</a></li>
                        <li><a href="#">BLOG</a></li>
                    </ul>
                    <a href="#" class="hire-link">Hire Us &rarr;</a>
                </div>
            </div>

            <!-- 중단 행 -->
            <div class="row middle-row">
                <div class="collab-wrapper">
                    <button class="collab-btn yellow-btn">RECENT COLLABS</button>
                    <button class="collab-btn white-btn">RECENT COLLABS</button>
                    <span class="more-cases">MORE CASES</span>
                </div>
                <div class="card circuit-card"></div>
            </div>

            <!-- 하단 행 -->
            <div class="row bottom-row">
                <div class="card retro-card"></div>
                <div class="card pcb-card"></div>
                <div class="card text-card">
                    <p>Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has be</p>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
