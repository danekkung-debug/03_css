<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNKRS. - AIR MAX PULSE</title>
    <!-- 구글 폰트 적용 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- 외부 CSS 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-container">
    <!-- 왼쪽 정보 영역 -->
    <div class="left-section">
        <div class="header">
            <div class="logo">SNKRS.</div>
            <nav class="nav">
                <a href="#">Men</a>
                <a href="#" class="active">Women</a>
                <a href="#">Kids</a>
            </nav>
        </div>

        <div class="product-info">
            <span class="badge">LIMITED EDITION</span>
            <h1 class="title">
                AIR MAX
                <span class="highlight">PULSE</span>
            </h1>
            <p class="subtitle">Pushing the limits of what's possible.</p>
        </div>

        <div class="size-selection">
            <div class="size-label">Select Size (US)</div>
            <div class="size-options">
                <button class="size-btn">7</button>
                <button class="size-btn">8</button>
                <button class="size-btn active">9</button>
                <button class="size-btn">10</button>
                <button class="size-btn">11</button>
            </div>
        </div>

        <div class="action-section">
            <div class="price">$ 185.00</div>
            <button class="add-to-bag">
                ADD TO BAG &rarr;
            </button>
        </div>
    </div>

    <!-- 오른쪽 이미지 영역 -->
    <div class="right-section">
        <div class="image-card">
            <!-- 신발 이미지 경로 -->
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=800&auto=format&fit=crop" alt="Air Max Pulse">
        </div>

        <div class="specs-overlay">
            <div class="spec-item">
                <span class="spec-value">270도</span>
                <span class="spec-label">AIR UNIT</span>
            </div>
            <div class="spec-item">
                <span class="spec-value">12oz</span>
                <span class="spec-label">LIGHTWEIGHT</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
